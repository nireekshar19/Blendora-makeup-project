
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart | Blendora</title>
<link rel="stylesheet" href="css/style.css">

<style>
.cart-container {
    max-width: 1000px;
    margin: 45px auto;
    padding: 20px;
}

.cart-heading {
    text-align: center;
    color: #82415e;
    margin-bottom: 30px;
}

.cart-item {
    display: grid;
    grid-template-columns: 110px 1fr auto;
    gap: 20px;
    align-items: center;
    background: white;
    padding: 20px;
    margin-bottom: 18px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.cart-item img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 10px;
    background: #f8e9ed;
}

.cart-item h3 {
    color: #82415e;
    margin-bottom: 8px;
}

.cart-item p {
    color: #666;
    margin: 6px 0;
}

.quantity-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
}

.quantity-controls button {
    background: #a85d7c;
    color: white;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
}

.remove-button {
    background: #f5e4eb;
    color: #82415e;
    border: none;
    padding: 9px 15px;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 10px;
}

.item-price {
    color: #82415e;
    font-size: 20px;
    font-weight: bold;
}

.cart-summary {
    background: #fff7fa;
    padding: 25px;
    border-radius: 15px;
    margin-top: 25px;
    text-align: right;
}

.cart-summary h2 {
    color: #82415e;
}

.checkout-button {
    display: inline-block;
    background: #a85d7c;
    color: white;
    padding: 13px 28px;
    border: none;
    border-radius: 25px;
    text-decoration: none;
    cursor: pointer;
    margin-top: 15px;
}

.checkout-button:hover {
    background: #82415e;
}

.back-link {
    display: inline-block;
    margin-top: 25px;
    color: #82415e;
    text-decoration: none;
}

.empty-cart {
    text-align: center;
    color: #82415e;
    padding: 40px 15px;
}

@media(max-width:600px) {
    .cart-item {
        grid-template-columns: 80px 1fr;
        gap: 12px;
        padding: 14px;
    }

    .cart-item img {
        width: 80px;
        height: 80px;
    }

    .item-price {
        grid-column: 2;
    }
}
</style>
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">Blendora<span>.</span></a>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="quiz.html">Shade Quiz</a>
        <a href="products.html">Products</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<main class="cart-container">

    <h1 class="cart-heading">My Shopping Cart</h1>

    <div id="cartItems"></div>

    <div class="cart-summary" id="cartSummary" style="display:none">
        <h2>Order Summary</h2>
        <p>Subtotal: ₹<span id="subtotal">0</span></p>
        <h2>Total: ₹<span id="total">0</span></h2>

        <!-- Direct Checkout Link -->
        <a href="checkout.html" class="checkout-button">
            Proceed to Checkout
        </a>
    </div>

    <a href="products.html" class="back-link">
        ← Continue Shopping
    </a>

</main>

<script>
function getCart() {
    try {
        return JSON.parse(
            localStorage.getItem("blendoraCart") || "[]"
        );
    } catch {
        return [];
    }
}

function saveCart(cart) {
    localStorage.setItem(
        "blendoraCart",
        JSON.stringify(cart)
    );
}

function getImage(product) {
    if (product.image) {
        return product.image;
    }

    const category = String(product.category || "").toLowerCase();

    if (category.includes("concealer")) {
        return "images/concealer.jpg";
    }

    return "images/foundation.jpg";
}

function renderCart() {
    const cart = getCart();
    const cartItems = document.getElementById("cartItems");
    const cartSummary = document.getElementById("cartSummary");

    cartItems.innerHTML = "";

    if (cart.length === 0) {
        cartItems.innerHTML = `
            <div class="empty-cart">
                <h2>Your cart is empty</h2>
                <p>Add your favourite Blendora products to continue.</p>
                <a href="products.html" class="checkout-button">
                    Explore Products
                </a>
            </div>
        `;

        cartSummary.style.display = "none";
        return;
    }

    cartSummary.style.display = "block";

    let total = 0;

    cart.forEach((product, index) => {
        const quantity = Number(product.quantity || 1);
        const price = Number(product.price || 0);
        const itemTotal = price * quantity;

        total += itemTotal;

        const item = document.createElement("div");
        item.className = "cart-item";

        const image = document.createElement("img");
        image.src = getImage(product);
        image.alt = product.name || "Blendora product";

        const info = document.createElement("div");

        const name = document.createElement("h3");
        name.textContent = product.name || "Blendora Product";

        const shade = document.createElement("p");
        shade.textContent = "Shade: " + (product.shade || "Various");

        const unitPrice = document.createElement("p");
        unitPrice.textContent = "Price: ₹" + price;

        const quantityControls = document.createElement("div");
        quantityControls.className = "quantity-controls";

        const minusButton = document.createElement("button");
        minusButton.textContent = "−";
        minusButton.onclick = () => changeQuantity(index, -1);

        const quantityText = document.createElement("span");
        quantityText.textContent = quantity;

        const plusButton = document.createElement("button");
        plusButton.textContent = "+";
        plusButton.onclick = () => changeQuantity(index, 1);

        quantityControls.append(
            minusButton,
            quantityText,
            plusButton
        );

        const removeButton = document.createElement("button");
        removeButton.className = "remove-button";
        removeButton.textContent = "Remove";
        removeButton.onclick = () => removeProduct(index);

        info.append(
            name,
            shade,
            unitPrice,
            quantityControls,
            removeButton
        );

        const itemPrice = document.createElement("div");
        itemPrice.className = "item-price";
        itemPrice.textContent = "₹" + itemTotal;

        item.append(image, info, itemPrice);
        cartItems.appendChild(item);
    });

    document.getElementById("subtotal").textContent = total;
    document.getElementById("total").textContent = total;
}

function changeQuantity(index, change) {
    const cart = getCart();

    if (!cart[index]) return;

    const currentQuantity = Number(cart[index].quantity || 1);
    const newQuantity = currentQuantity + change;

    if (newQuantity <= 0) {
        cart.splice(index, 1);
    } else {
        cart[index].quantity = newQuantity;
    }

    saveCart(cart);
    renderCart();
}

function removeProduct(index) {
    const cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);
    renderCart();
}

renderCart();
</script>

</body>
</html>
