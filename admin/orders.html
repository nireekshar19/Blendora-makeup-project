
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blendora | Admin Orders</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7f8;
      color: #33252b;
    }
    header {
      background: #8b3455;
      color: white;
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    main { padding: 24px; }
    h1 { margin: 0; font-size: 24px; }
    .orders {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin-top: 20px;
    }
    .order {
      background: white;
      border: 1px solid #f0dce3;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 14px #00000008;
    }
    .order h3 { margin-top: 0; color: #8b3455; }
    .order p { margin: 8px 0; overflow-wrap: anywhere; }
    select, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d8b8c5;
      font-size: 14px;
    }
    select { width: 100%; margin-top: 10px; }
    button {
      background: #8b3455;
      color: white;
      border: 0;
      cursor: pointer;
    }
    .message { margin-top: 15px; font-weight: bold; }
    .empty { padding: 20px; background: white; border-radius: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Blendora — All Orders</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <h2>Customer Orders</h2>
    <p id="message" class="message">Loading orders...</p>
    <div id="orders" class="orders"></div>
  </main>

  <script type="module">
    import { auth } from "../js/firebase-config.js";
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const API_BASE = "http://localhost:5000";
    const ordersContainer = document.getElementById("orders");
    const message = document.getElementById("message");

    async function getToken(user) {
      return await user.getIdToken();
    }

    async function loadOrders(user) {
      try {
        message.textContent = "Loading orders...";
        const token = await getToken(user);

        const response = await fetch(`${API_BASE}/api/admin/orders`, {
          headers: { Authorization: `Bearer ${token}` }
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || data.error || "Unable to load orders");
        }

        const orders = data.orders || data;

        ordersContainer.innerHTML = "";

        if (!Array.isArray(orders) || orders.length === 0) {
          message.textContent = "No orders found yet.";
          return;
        }

        message.textContent = `${orders.length} order(s) found`;

        orders.forEach(order => {
          const card = document.createElement("div");
          card.className = "order";

          const orderId = order.id || order.orderId;
          const status = order.status || "pending";
          const total = order.total ?? order.totalAmount ?? 0;

          card.innerHTML = `
            <h3>Order #${orderId}</h3>
            <p><b>Customer:</b> ${order.customerName || order.name || "Customer"}</p>
            <p><b>Email:</b> ${order.customerEmail || order.email || "Not available"}</p>
            <p><b>Total:</b> ₹${Number(total).toFixed(2)}</p>
            <p><b>Payment:</b> ${order.paymentStatus || "Demo / Unpaid"}</p>
            <p><b>Current status:</b> ${status}</p>
            <label>Update order status</label>
            <select class="statusSelect">
              <option value="pending">Pending</option>
              <option value="processing">Processing</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <button class="updateBtn" style="margin-top:10px;width:100%">
              Update Status
            </button>
          `;

          const select = card.querySelector(".statusSelect");
          select.value = status.toLowerCase();

          card.querySelector(".updateBtn").addEventListener("click", async () => {
            try {
              const newStatus = select.value;
              const token = await getToken(user);

              const updateResponse = await fetch(
                `${API_BASE}/api/admin/orders/${encodeURIComponent(orderId)}/status`,
                {
                  method: "PATCH",
                  headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`
                  },
                  body: JSON.stringify({ status: newStatus })
                }
              );

              const result = await updateResponse.json();

              if (!updateResponse.ok) {
                throw new Error(result.message || result.error || "Status update failed");
              }

              alert("Order status updated!");
              loadOrders(user);
            } catch (error) {
              alert(error.message);
            }
          });

          ordersContainer.appendChild(card);
        });
      } catch (error) {
        message.textContent = error.message;
      }
    }

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "../login.html";
        return;
      }
      loadOrders(user);
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "../login.html";
    });
  </script>
</body>
</html>
