
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products | Blendora</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .products-page {
            max-width: 1100px;
            margin: auto;
            padding: 45px 20px;
        }

        .products-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .products-heading h1 {
            color: #82415e;
            font-size: 34px;
        }

        .products-heading p {
            color: #777;
            margin-top: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-align: center;
            padding-bottom: 25px;
        }

        .product-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .product-card h2 {
            color: #82415e;
            margin: 18px 10px 8px;
        }

        .product-card p {
            color: #666;
            padding: 0 18px;
            line-height: 1.6;
        }

        .product-price {
            color: #82415e;
            font-size: 21px;
            font-weight: bold;
            margin: 15px 0;
        }

        .product-button {
            display: inline-block;
            background: #a85d7c;
            color: white;
            border: none;
            padding: 11px 25px;
            border-radius: 25px;
            margin: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .product-button:hover {
            background: #82415e;
        }

        .back-link {
            display: inline-block;
            margin-top: 35px;
            color: #82415e;
            text-decoration: none;
        }

        .cart-link {
            float: right;
            color: #82415e;
            font-weight: bold;
        }

        #cartMessage {
            text-align: center;
            margin-top: 20px;
            color: #34734a;
        }

        #apiStatus {
            text-align: center;
            color: #82415e;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">Blendora<span>.</span></a>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="quiz.html">Shade Quiz</a>
        <a href="products.html">Products</a>
        <a href="login.html">Login</a>
    </nav>

    <a href="cart.html" class="nav-button">
        My Cart (<span id="cartCount">0</span>)
    </a>
</header>

<main class="products-page">

    <div class="products-heading">
        <h1>Explore Our Products</h1>
        <p>Beauty that blends perfectly with your skin.</p>
    </div>

    <p id="apiStatus">Loading products...</p>

    <div class="product-grid" id="productGrid"></div>

    <p id="cartMessage" role="status"></p>

    <a href="index.html" class="back-link">← Back to Home</a>

</main>

<script>
    const API_BASE_URL =
        "https://blendora-makeup-project.onrender.com";

    const imageMap = {
        1: "images/foundation.jpg",
        2: "images/concealer.jpg"
    };

    const descriptionMap = {
        1: "A personalized foundation designed around your skin tone and undertone.",
        2: "A personalized concealer selected according to your skin profile."
    };

    let productData = [];

    async function loadProducts() {
        const status = document.getElementById("apiStatus");
        const grid = document.getElementById("productGrid");

        try {
            const response = await fetch(
                `${API_BASE_URL}/api/products`
            );

            if (!response.ok) {
                throw new Error("Unable to load products");
            }

            productData = await response.json();

            grid.innerHTML = "";

            productData.forEach(product => {
                const image = imageMap[product.id] ||
                    "images/products.jpg";

                const description = descriptionMap[product.id] ||
                    "Explore our personalized beauty product.";

                const card = document.createElement("div");
                card.className = "product-card";

                const img = document.createElement("img");
                img.src = image;
                img.alt = product.name;

                const heading = document.createElement("h2");
                heading.textContent = product.name;

                const paragraph = document.createElement("p");
                paragraph.textContent = description;

                const price = document.createElement("div");
                price.className = "product-price";
                price.textContent = "₹" + product.price;

                const shadeLink = document.createElement("a");
                shadeLink.href = "quiz.html";
                shadeLink.className = "product-button";
                shadeLink.textContent = "Find My Shade";

                const cartButton = document.createElement("button");
                cartButton.className = "product-button";
                cartButton.textContent = "Add to Cart";
                cartButton.addEventListener("click", () => {
                    addToCart(product);
                });

                card.append(
                    img,
                    heading,
                    paragraph,
                    price,
                    shadeLink,
                    cartButton
                );

                grid.appendChild(card);
            });

            status.textContent = "Products loaded successfully!";

        } catch (error) {
            console.error("Product loading error:", error);

            status.textContent =
                "Unable to load products. Please refresh the page.";
        }
    }

    function addToCart(product) {
        const cart = JSON.parse(
            localStorage.getItem("blendoraCart") || "[]"
        );

        const cartProduct = {
            id: String(product.id),
            name: product.name,
            price: Number(product.price),
            image: imageMap[product.id] || "images/products.jpg"
        };

        cart.push(cartProduct);

        localStorage.setItem(
            "blendoraCart",
            JSON.stringify(cart)
        );

        updateCartCount();

        document.getElementById("cartMessage").textContent =
            product.name + " added to your cart!";
    }

    function updateCartCount() {
        const cart = JSON.parse(
            localStorage.getItem("blendoraCart") || "[]"
        );

        document.getElementById("cartCount").textContent =
            cart.length;
    }

    updateCartCount();
    loadProducts();
</script>

</body>
</html>
